<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Trivia Forge</title>

    <!-- Silkscreen -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="menu-container">
    <h1>Trivia Forge</h1>

    <button onclick="location.href='index.html?new=true'">
        Play Game
    </button>

    <button onclick="location.href='admin.html'">Question Editor</button>

    <div id="sound-setting">
        <label>
            Enable Sound Effects
            <input type="checkbox" id="sound-toggle">
        </label>
    </div>
</div>

<script>
if (localStorage.getItem("soundEnabled") === null) {
    localStorage.setItem("soundEnabled", "false");
}

const toggle = document.getElementById("sound-toggle");
toggle.checked = localStorage.getItem("soundEnabled") === "true";

toggle.addEventListener("change", () => {
    localStorage.setItem("soundEnabled", toggle.checked ? "true" : "false");
});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
