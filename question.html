<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Question</title>

    <!-- Silkscreen -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="question-container">
    <div class="question-layout">
        <div class="question-main">
            <p id="question-text"></p>

            <img id="question-image"
                 style="max-width: 80%;
                        max-height: 400px;
                        display: none;
                        margin: 12px auto;
                        object-fit: contain;">

            <audio id="question-audio"
                   controls
                   style="display: none;
                          margin: 12px auto;"></audio>

            <button id="show-answer">Show Answer</button>
            <p id="answer-text" class="hidden"></p>

            <div id="participant-scores"></div>
        </div>

        <aside class="question-sidebar">
            <div id="stopwatch-panel" class="stopwatch-panel" aria-live="polite">
                <div class="stopwatch-shell">
                    <div class="stopwatch-controls-panel">
                        <div class="stopwatch-time-adjuster">
                            <button id="time-decrease" class="time-adjust-btn" type="button">−</button>
                            <div id="time-value" class="time-value">01:00</div>
                            <button id="time-increase" class="time-adjust-btn" type="button">+</button>
                        </div>
                    </div>

                    <div class="stopwatch-face">
                        <div id="stopwatch-display" class="stopwatch-display">01:00</div>
                    </div>

                    <div class="stopwatch-controls-panel bottom-controls">
                        <div class="stopwatch-action-stack">
                            <button id="stopwatch-toggle" type="button">Start</button>
                            <button id="stopwatch-reset" type="button">Reset</button>
                        </div>
                    </div>
                </div>
            </div>
        </aside>
    </div>
</div>

<!-- FOOTER BACK BUTTON -->
<div id="question-footer">
    <button id="back">Back to Board</button>
</div>


<script>
const sounds = {
    chime: new Audio("sounds/chime.mp3")
};

function playSound(name) {
    if (localStorage.getItem("soundEnabled") !== "true") return;

    const s = sounds[name];
    if (!s) return;
    s.currentTime = 0;
    s.play().catch(() => {});
}

// LOAD QUESTION
let gameData = JSON.parse(sessionStorage.getItem("gameData") || "null");
const q = JSON.parse(sessionStorage.getItem("currentQuestion") || "null");
const key = sessionStorage.getItem("currentKey");

if (q) {
    document.getElementById("question-text").textContent = q.question || "";
    document.getElementById("answer-text").textContent = q.answer || "";

    if (q.image) {
        const img = document.getElementById("question-image");
        img.src = q.image;
        img.style.display = "block";
    }

    if (q.audio) {
        const aud = document.getElementById("question-audio");
        aud.src = q.audio;
        aud.style.display = "block";
    }
}

// MARK USED
if (key) {
    localStorage.setItem(key, "used");
}

// COUNTDOWN TIMER
let countdownRunning = false;
let countdownStartedAt = 0;
let countdownRemainingMs = 60000;
let countdownStartingMs = 60000;
let countdownTimerId = null;

function formatCountdown(ms) {
    const totalSeconds = Math.max(0, Math.floor(ms / 1000));
    const minutes = String(Math.floor(totalSeconds / 60));
    const seconds = String(totalSeconds % 60).padStart(2, "0");
    return `${minutes}:${seconds}`;
}

function updateCountdownDisplay() {
    const display = document.getElementById("stopwatch-display");
    if (!display) return;

    const remaining = countdownRunning
        ? countdownRemainingMs - (Date.now() - countdownStartedAt)
        : countdownRemainingMs;

    const safeRemaining = Math.max(0, remaining);
    display.textContent = formatCountdown(safeRemaining);

    if (safeRemaining <= 0) {
        pauseCountdown();
        playSound("chime");
    }
}

function startCountdown() {
    if (countdownRunning) return;

    countdownRunning = true;
    countdownStartedAt = Date.now();
    document.getElementById("stopwatch-toggle").textContent = "Pause";

    countdownTimerId = window.setInterval(updateCountdownDisplay, 100);
    updateCountdownDisplay();
}

function pauseCountdown() {
    if (!countdownRunning) return;

    countdownRemainingMs = Math.max(0, countdownRemainingMs - (Date.now() - countdownStartedAt));
    countdownRunning = false;
    document.getElementById("stopwatch-toggle").textContent = "Start";

    if (countdownTimerId) {
        window.clearInterval(countdownTimerId);
        countdownTimerId = null;
    }

    updateCountdownDisplay();
}

function resetCountdown() {
    if (countdownTimerId) {
        window.clearInterval(countdownTimerId);
        countdownTimerId = null;
    }

    countdownRunning = false;
    countdownStartedAt = 0;
    countdownRemainingMs = countdownStartingMs;
    document.getElementById("stopwatch-toggle").textContent = "Start";
    updateCountdownDisplay();
    updateTimeValueDisplay();
}

function setCountdown(seconds) {
    countdownRemainingMs = seconds * 1000;
    countdownStartingMs = countdownRemainingMs;
    countdownStartedAt = 0;
    if (!countdownRunning) {
        updateCountdownDisplay();
    }
}

document.getElementById("stopwatch-toggle").onclick = () => {
    if (countdownRunning) {
        pauseCountdown();
    } else {
        startCountdown();
    }
};

document.getElementById("stopwatch-reset").onclick = resetCountdown;

function updateTimeValueDisplay() {
    const value = document.getElementById("time-value");
    if (value) {
        value.textContent = formatCountdown(countdownRemainingMs);
    }
}

document.getElementById("time-decrease").onclick = () => {
    const newSeconds = Math.max(30, Math.floor(countdownRemainingMs / 1000) - 30);
    setCountdown(newSeconds);
    resetCountdown();
    updateTimeValueDisplay();
};

document.getElementById("time-increase").onclick = () => {
    const newSeconds = Math.floor(countdownRemainingMs / 1000) + 30;
    setCountdown(newSeconds);
    resetCountdown();
    updateTimeValueDisplay();
};

updateTimeValueDisplay();
updateCountdownDisplay();

// SHOW / HIDE ANSWER
const showAnswerButton = document.getElementById("show-answer");
const answerTextElement = document.getElementById("answer-text");
let answerVisible = false;

function setAnswerVisible(visible) {
    answerVisible = visible;
    answerTextElement.classList.toggle("hidden", !visible);
    showAnswerButton.textContent = visible ? "Hide Answer" : "Show Answer";

    if (visible) {
        playSound("chime");
        showParticipantScores();
    }
}

showAnswerButton.onclick = () => {
    setAnswerVisible(!answerVisible);
};

// SHOW PARTICIPANTS (with individual give buttons)
function showParticipantScores() {
    const container = document.getElementById("participant-scores");
    
    if (!container) {
        console.error("participant-scores element not found");
        return;
    }
    
    container.innerHTML = "";

    if (!gameData || !Array.isArray(gameData.participants) || gameData.participants.length === 0) {
        return;
    }

    gameData.participants.forEach((p, index) => {
        const box = document.createElement("div");
        box.classList.add("score-box");

        const name = document.createElement("div");
        name.classList.add("name");
        name.textContent = p.name;

        const divider = document.createElement("div");
        divider.classList.add("divider");

        const score = document.createElement("div");
        score.classList.add("score");
        score.textContent = p.score;

        const give = document.createElement("button");
        give.textContent = "Give Points";
        give.className = "give-btn";

        give.onclick = () => {
            givePoints(index);
        };

        box.appendChild(name);
        box.appendChild(divider);
        box.appendChild(score);
        box.appendChild(give);

        container.appendChild(box);
    });
}

// GIVE POINTS TO SPECIFIC PLAYER
function givePoints(index) {
    if (!gameData || !Array.isArray(gameData.participants)) return;
    if (!q) return;
    if (!gameData.participants[index]) return;

    gameData.participants[index].score += q.value || 0;

    sessionStorage.setItem("gameData", JSON.stringify(gameData));

    showParticipantScores();
}

// BACK
document.getElementById("back").onclick = () => {
    sessionStorage.removeItem("currentQuestion");
    sessionStorage.removeItem("currentKey");

    window.location.href = "index.html";
};
</script>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
